services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: barad_dur
      POSTGRES_PASSWORD: barad_dur
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barad_dur"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: barad_dur-app
    entrypoint: bin/docker-env
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare db:seed && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - ${CLAUDE_CONFIG_PATH:-~/.claude}:/root/.claude
    ports:
      - "3000:3000"
    environment:
      # the host folder actually mounted at /workspace, shown in the wizard
      WORKSPACE_PATH: ${WORKSPACE_PATH:-./workspace}
      DB_HOST: db
      DB_USER: barad_dur
      DB_PASSWORD: barad_dur
      RAILS_MAX_THREADS: "5"
      # "use mode": skip dev-reload checks + verbose logging for much faster
      # renders. Set to 0 when editing the app's own code.
      DISABLE_RELOADING: ${DISABLE_RELOADING:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      PIPELINE_RUNNER: ${PIPELINE_RUNNER:-auto}
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_FLAGS: ${CLAUDE_FLAGS:-}
      GH_TOKEN: ${GH_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  # Advances the pipeline: enqueues one engine tick every few seconds.
  # Separate from the web process; broadcasts reach browsers via Solid Cable.
  # Shares the web image (agent runs execute here — claude CLI included).
  ticker:
    # Same build as web (identical context and image name, so it is built
    # once and reused). Without a build section Compose tries to PULL
    # barad_dur-app from a registry, which fails on any machine that has not
    # already built it.
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: barad_dur-app
    entrypoint: bin/docker-env
    command: bin/rails pipeline:ticker
    volumes:
      - .:/app
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - ${CLAUDE_CONFIG_PATH:-~/.claude}:/root/.claude
    environment:
      # the host folder actually mounted at /workspace, shown in the wizard
      WORKSPACE_PATH: ${WORKSPACE_PATH:-./workspace}
      DB_HOST: db
      DB_USER: barad_dur
      DB_PASSWORD: barad_dur
      DISABLE_RELOADING: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      PIPELINE_RUNNER: ${PIPELINE_RUNNER:-auto}
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_FLAGS: ${CLAUDE_FLAGS:-}
      GH_TOKEN: ${GH_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
